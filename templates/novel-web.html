<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}} — 一叶轻舟工作室</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "{{fontFamily}}", "SimSun", "Songti SC", "Noto Serif CJK SC", serif;
    font-size: {{fontSize}}pt;
    line-height: {{lineHeight}};
    color: #2c2c2c;
    max-width: 820px;
    margin: 0 auto;
    padding: 3em 2em;
    background: #fdfaf3;
  }

  /* 书名页 */
  .title-page {
    text-align: center;
    padding: 6em 0;
    border-bottom: 2px solid #ddd;
    margin-bottom: 3em;
  }
  .title-page h1 {
    font-size: 2.2em;
    font-family: "SimHei", "Heiti SC", "PingFang SC", sans-serif;
    letter-spacing: 4px;
    margin-bottom: 0.5em;
  }
  .title-page .meta {
    font-size: 0.9em;
    color: #888;
  }
  .title-page .divider {
    width: 60px;
    height: 1px;
    background: #ccc;
    margin: 2em auto;
  }

  /* 目录 */
  .toc { margin: 3em 0; }
  .toc h2 { text-align: center; font-size: 1.5em; margin-bottom: 1em; }
  .toc ol { list-style: none; padding: 0; }
  .toc li {
    padding: 0.4em 0;
    border-bottom: 1px dotted #ddd;
    font-size: 0.95em;
  }

  /* 标题 */
  h1 { text-align: center; font-size: 1.8em; margin: 2em 0 0.8em; font-family: "SimHei", "Heiti SC", "PingFang SC", sans-serif; }
  h2 { font-size: 1.4em; margin: 1.5em 0 0.6em; }
  h3 { font-size: 1.1em; margin: 1em 0 0.5em; }

  /* 段落 */
  p { text-indent: 2em; margin: 0.5em 0; text-align: justify; overflow-wrap: break-word; }
  p.no-indent { text-indent: 0; }
  {{dropCapCSS}}

  /* 链接和强调 */
  a { color: #666; text-decoration: none; border-bottom: 1px dotted #999; }
  strong { color: #111; }
  em { font-style: italic; }

  /* 引用 */
  blockquote {
    margin: 1em 2em;
    padding: 0.5em 1.2em;
    border-left: 3px solid #bbb;
    background: #f8f5ee;
    font-style: italic;
    color: #666;
  }
  blockquote p { text-indent: 0; }

  /* 列表 */
  ul, ol { margin: 0.8em 0 0.8em 2em; }
  li { margin: 0.3em 0; }

  /* 分隔线 */
  hr { border: none; border-top: 1px solid #ddd; margin: 2em 0; text-align: center; }
  hr::after { content: '✦'; color: #bbb; font-size: 0.8em; }

  /* 页脚 */
  .footer {
    text-align: center;
    margin-top: 4em;
    padding-top: 2em;
    border-top: 1px solid #eee;
    font-size: 0.8em;
    color: #aaa;
  }

  /* 打印样式 */
  @media print {
    body { background: #fff; color: #000; }
    .title-page { page-break-after: always; }
    h1 { page-break-before: always; }
  }
</style>
</head>
<body>

<div class="title-page">
  <h1>{{title}}</h1>
  <div class="divider"></div>
  <p class="meta">一叶轻舟工作室 · AI 辅助创作</p>
</div>

<article>
{{content}}
</article>

<div class="footer">
  <p>由 <strong>一叶轻舟工作室</strong> AI 辅助生成</p>
</div>

</body>
</html>
